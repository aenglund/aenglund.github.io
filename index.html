---
layout: default
---
<section class="home-hero">
  <div class="home-hero__top">
    <img src="https://gravatar.com/avatar/3077621ea0004a1b15e74e778cb2c5e942eb943bf4f4b042da810c363d8a221e?size=256" alt="Albin Englund" class="home-hero__photo">
    <div class="home-hero__content">
      <h1 class="home-hero__title">Albin Englund</h1>
      <p class="home-hero__bio">{{ site.description }}</p>
    </div>
  </div>
</section>

<section class="home-section">
  <p class="home-section__label">Recent writing</p>
  <ul class="post-list">
    {% for post in site.posts limit:5 %}
    <li class="post-list__item">
      <div class="post-list__row">
        <a href="{{ post.url | relative_url }}" class="post-list__title">{{ post.title }}</a>
        <span class="post-list__date">{{ post.date | date: "%b %Y" }}</span>
      </div>
      {% if post.description %}<p class="post-list__description">{{ post.description }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
